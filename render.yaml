services:
  - type: web
    name: safetrack-child-security
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Optional: a Render Postgres URL makes accounts survive restarts (SQLite is used otherwise)
      # - key: DATABASE_URL
      #   fromDatabase: { name: safetrack-db, property: connectionString }
      # Optional SMS for critical alerts
      # - key: TWILIO_ACCOUNT_SID
      #   sync: false
      # - key: TWILIO_AUTH_TOKEN
      #   sync: false
      # - key: TWILIO_FROM_NUMBER
      #   sync: false
